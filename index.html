
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiryat Eliezer Empire</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

    <div id="header">
        <img src="emblem.png" id="emblem" alt="Empire Emblem">

        <span id="site-title">KIRYAT ELIEZER EMPIRE</span>

        <a href="about.html" id="about-link" title="About the Empire">
            <span>ABOUT US</span>
        </a>

        <a href="admin.html" id="admin-link" title="Admin panel">
            <span>ADMIN</span>
        </a>
    </div>

    <main id="main-layout">

        <section id="map-container">
            <div id="map-timeline">
                <div class="map-timeline-heading">
                    <span class="map-timeline-kicker">FRONTLINE ARCHIVE</span>
                    <strong id="map-date-label">Loading map date...</strong>
                </div>
                <label for="map-date-select">VIEW MAP AS OF</label>
                <select id="map-date-select" disabled>
                    <option>Loading dates...</option>
                </select>
                <span id="map-archive-status" role="status">Loading map archive...</span>
            </div>
            <div id="map"></div>
            <div id="map-legend">
    <div class="legend-title">MAP LEGEND</div>

    <div class="legend-item">
        <span class="legend-color legend-blue"></span>
        <span>Empire Territories</span>
    </div>

    <div class="legend-item">
        <span class="legend-color legend-red"></span>
        <span>Territories captured in Operation Frozen Thunder</span>
    </div>

    <div class="legend-item">
        <span class="legend-color legend-black"></span>
        <span>Bronik Group</span>
    </div>
</div>
        </section>

        <aside id="news-panel">

            <div id="news-header">
                <div>
                    <h2>NEWS FEED</h2>
                    <span id="news-subtitle">LATEST DEVELOPMENTS</span>
                </div>

                <span id="news-live">LIVE</span>
            </div>

            <div id="news-list">
                <div class="news-status">
                    Loading news...
                </div>
            </div>

        </aside>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>
</html>
