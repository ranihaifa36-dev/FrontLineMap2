
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiryat Eliezer Empire</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

    <div id="header">
        <img src="emblem.png" id="emblem" alt="Empire Emblem">

        <span id="site-title">KIRYAT ELIEZER EMPIRE</span>

        <a href="about.html" id="about-link" title="About the Empire">
            <span>ABOUT US</span>
        </a>

        <a href="admin.html" id="admin-link" title="Admin panel">
            <span>ADMIN</span>
        </a>
    </div>

    <main id="main-layout">

        <section id="map-container">
            <div id="map"></div>
        </section>

        <aside id="news-panel">

            <div id="news-header">
                <div>
                    <h2>NEWS FEED</h2>
                    <span id="news-subtitle">LATEST DEVELOPMENTS</span>
                </div>

                <span id="news-live">LIVE</span>
            </div>

            <div id="news-list">
                <div class="news-status">
                    Loading news...
                </div>
            </div>

        </aside>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>
</html>
