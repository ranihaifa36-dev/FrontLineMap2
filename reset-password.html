
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Frontline Map</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #15191e;
            color: #e8edf2;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 430px;
            background: #20262d;
            border: 1px solid #343b44;
            border-radius: 4px;
            padding: 28px;
        }

        h2 {
            font-size: 17px;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        p {
            color: #9ba8b5;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #aab5c0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: #151a20;
            border: 1px solid #3b4652;
            border-radius: 3px;
            padding: 12px;
            color: white;
            font-size: 14px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #8296aa;
        }

        button {
            width: 100%;
            background: #344b60;
            color: white;
            border: 1px solid #526a80;
            border-radius: 3px;
            padding: 13px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #405e78;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            font-size: 12px;
            margin-top: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .success {
            color: #83c99b;
        }

        .error {
            color: #e58b8b;
        }

        #reset-form {
            display: none;
        }

        a {
            color: #b5c2ce;
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="panel">

    <h2>RESET PASSWORD</h2>

    <p>
        Enter your new administrator password below.
    </p>

    <form id="reset-form">

        <label for="new-password">New password</label>

        <input
            type="password"
            id="new-password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter new password"
        >

        <label for="confirm-password">Confirm new password</label>

        <input
            type="password"
            id="confirm-password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Confirm new password"
        >

        <button type="submit" id="save-button">
            SAVE NEW PASSWORD
        </button>

    </form>

    <div id="status" role="status">
        Verifying recovery link...
    </div>

    <p style="margin-top:20px; margin-bottom:0;">
        <a href="admin.html">BACK TO ADMIN LOGIN</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    'https://qeiospslkykwdrbgflzb.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_HuG7VQQDL5hbhM3zwvOJIA_w0sE5H1V';

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const resetForm = document.getElementById('reset-form');
const status = document.getElementById('status');
const saveButton = document.getElementById('save-button');

let recoveryVerified = false;

function showStatus(message, type = '') {
    status.textContent = message;
    status.className = type;
}

async function checkRecoverySession() {

    try {

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (!data.session) {
            throw new Error(
                'Invalid or expired recovery link. Request a new password reset email.'
            );
        }

        recoveryVerified = true;

        resetForm.style.display = 'block';

        showStatus(
            'Recovery link verified. You can now set a new password.'
        );

    } catch (error) {

        recoveryVerified = false;

        resetForm.style.display = 'none';

        showStatus(error.message, 'error');

    }

}

resetForm.addEventListener('submit', async function(event) {

    event.preventDefault();

    if (!recoveryVerified) {
        showStatus('Recovery session is not valid.', 'error');
        return;
    }

    const password =
        document.getElementById('new-password').value;

    const confirmation =
        document.getElementById('confirm-password').value;

    if (password.length < 8) {
        showStatus(
            'Password must contain at least 8 characters.',
            'error'
        );
        return;
    }

    if (password !== confirmation) {
        showStatus(
            'Passwords do not match.',
            'error'
        );
        return;
    }

    saveButton.disabled = true;
    showStatus('Updating password...');

    try {

        const { error } = await db.auth.updateUser({
            password: password
        });

        if (error) throw error;

        recoveryVerified = false;

        resetForm.reset();
        resetForm.style.display = 'none';

        showStatus(
            'Password updated successfully! You can now return to the Admin Login and sign in with your new password.',
            'success'
        );

    } catch (error) {

        showStatus(
            'Could not update password: ' + error.message,
            'error'
        );

    } finally {

        saveButton.disabled = false;

    }

});

checkRecoverySession();

</script>

</body>
</html>
